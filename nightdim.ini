# NightDim configuration
# Put this file next to nightdim.prx in ms0:/seplugins/

# Default brightness when NightDim is ON (0-100)
brightness=35

# Warmth level: 0 = no filter, 100 = maximum warm (0-100)
warmth=50

# Auto-enable by time: 1 = ON, 0 = OFF
auto_time=0

# Time range for auto mode (24h format)
auto_start=21
auto_end=8
