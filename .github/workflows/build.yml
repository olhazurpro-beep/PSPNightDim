name: Build NightDim PSP Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build plugin
      run: |
        export PSPDEV=/usr/local/pspdev
        export PATH=$PSPDEV/bin:$PATH
        
        echo "=== PSP-CONFIG ==="
        psp-config --pspsdk-path
        
        echo "=== BUILD ==="
        make clean || true
        make
        
    - name: Check output
      run: |
        ls -la *.prx || echo "PRX not found!"
        
    - name: Upload artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: nightdim-prx
        path: |
          nightdim.prx
          nightdim.ini
        retention-days: 30
